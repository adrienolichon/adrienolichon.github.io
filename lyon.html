<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurants à Lyon</title>
    
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <link rel="stylesheet" href="lyon-files/hugeicons/hugeicons-font.css">
    <link rel="stylesheet" href="https://fonts.sandbox.google.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="lyon-files/style.css">
    
    <link rel="apple-touch-icon" sizes="180x180" href="favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon/favicon-16x16.png">
    <link rel="mask-icon" href="favicon/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
    <meta name="author" content="Adrien Olichon">
    <meta name="description" content="Découvrez mes recommandations de restaurants, cafés et bars à Lyon.">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>Restaurants à Lyon</h1>
            <p>Mes recommandations pour bien manger, boire et passer du temps.</p>
            <a href="https://maps.app.goo.gl/sgo9ETv2czm7os4s7" target="_blank" class="map-link">
                <i class="hgi hgi-duotone hgi-rounded hgi-location-01"></i>
                La liste Google Maps des Les +180 restaurants sur Lyon
            </a>
             
			<!-- Recherche --> 
                <div class="search-group">
                    <input type="text" id="searchInput" placeholder="🔍 Chercher par nom, catégorie..." class="search-input">
                </div>
			
        </header>

        <section class="results-section">
			 <section class="results-title">
            <i class="hgi hgi-duotone hgi-rounded hgi-star-award-01"></i>
			<h2>Les top du top restaurants, expérience et claque culinaire</h2>
        </section>
            <div id="cardsContainer" class="cards-grid"></div>            <div id="emptyState" class="empty-state" style="display: none;">
                <p>Aucun restaurant ne correspond à vos critères.</p>
            </div>
        </section>
    </div>
	<footer class="footer">
	  <a href="mailto:olichon.adrien@gmail.com?subject=Proposition de restaurant à Lyon" class="footer-link"><i class="hgi hgi-duotone hgi-rounded hgi-mail-01"></i>Proposer un restaurant</a>
	</footer>


    <script>
        let allRestaurants = [];

        async function loadRestaurants() {
            try {
                const response = await fetch('lyon-files/restaurants.json');
                if (!response.ok) throw new Error('Erreur lors du chargement du JSON');
                const data = await response.json();
                allRestaurants = Array.isArray(data) ? data : (data.restaurants || []);
                console.log('Restaurants chargés:', allRestaurants.length);
                renderCards(allRestaurants);
            } catch (error) {
                console.error('Erreur lors du chargement des restaurants:', error);
                document.getElementById('emptyState').textContent = 'Erreur lors du chargement des données.';
                document.getElementById('emptyState').style.display = 'block';
            }
        }

        function renderCards(restaurants) {
            const container = document.getElementById('cardsContainer');
            const emptyState = document.getElementById('emptyState');

            if (restaurants.length === 0) {
                container.innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            container.innerHTML = restaurants.map(restaurant => `
                <a href="${restaurant.mapsUrl}" target="_blank" class="card">
                    <div class="card-header">
                        <div class="card-title">
                            <h3>${restaurant.name}</h3>
                        </div>
                    </div>
                    <div class="card-body">
                        <p class="card-description focus-why">${restaurant.why}</p>
                        <div>
                            <span class="tag">${restaurant.category}</span>
                            <span class="tag">${restaurant.quartier}</span>
                        </div>
                    </div>
                </a>
            `).join('');
        }

        loadRestaurants();
    </script>
</body>

</html>
